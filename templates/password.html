{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="panel">
  <form method="post">
    <label for="cur">Current password</label><input id="cur" name="current" type="password" required autocomplete="current-password">
    <label for="new">New password (at least 6 characters)</label><input id="new" name="new" type="password" required autocomplete="new-password">
    <label for="again">New password again</label><input id="again" name="again" type="password" required autocomplete="new-password">
    <div class="actions"><button class="btn">Change password</button></div>
  </form>
</div>
{% endblock %}
